server:
  num-threads: 4
  do-daemonize: yes
  pidfile: "/test/resolver/unbound.pid"
  logfile: "/test/resolver/unbound.log"

  do-not-query-localhost: no
  domain-insecure: test
  local-zone: test nodefault

stub-zone:
  name: "test"
  stub-host: test
  stub-addr: 127.0.0.1@1053

stub-zone:
  name: "example.test"
  stub-host: example.test
  stub-addr: 127.0.0.1@1054

python:
dynlib:
remote-control:
  control-enable: yes
  control-interface: "/test/resolver/unbound.ctl"

forward-zone:
  name: "."
  forward-addr: 9.9.9.9
  forward-addr: 149.112.112.112
  forward-addr: 1.1.1.1
  forward-addr: 1.0.0.1
