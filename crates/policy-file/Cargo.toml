[package]
name = "cascade-policy-file"
description = "Cascade's policy files."

authors.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
license.workspace = true

version.workspace = true
rust-version.workspace = true
edition.workspace = true

readme = "README.md"


# --- Dependencies -------------------------------------------------------------

[dependencies]

[dependencies.domain]
workspace = true
features = ["tsig", "serde"]

# 'foldhash' offers fast, non-cryptographic hash tables.
[dependencies.foldhash]
workspace = true

# 'jiff' is a general-purpose time library.
[dependencies.jiff]
workspace = true

# 'serde' is used for parsing TOML configuration files.
[dependencies.serde]
workspace = true
features = ["derive"]

# 'serde-with' provides helpers for 'serde'.
[dependencies.serde_with]
workspace = true
