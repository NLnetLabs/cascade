server:
  ip-address: 0.0.0.0@1055
  verbosity: 5
  username: "" # disable privilege "drop" to user "nsd"
  debug-mode: no
  pidfile: "/test/primary/nsd.pid"
  logfile: "/test/primary/nsd.log"
  # NSD 4.3.9 option
  database: ""

  zonesdir: "/test/primary/"
  zonelistfile: "/test/primary/zone.list"
  xfrdfile: "/test/primary/ixfr.state"
  refuse-any: yes

# Syntax error in NSD 4.3.9 as installed from Ubuntu 22.04 package
#verify:

remote-control:
  control-enable: yes
  control-interface: "/test/primary/nsd.sock"

key:
  name: "tsig-key"
  algorithm: hmac-sha256
  secret: "COzoVsYQmXeXiyq1Quhp0bbVnMyxjPxsaGSoIWR98i0="

zone:
  name: example.test
  zonefile: "%s.zone"
  provide-xfr: 127.0.0.1 NOKEY
  notify: 127.0.0.1@4542 NOKEY 
  store-ixfr: yes
  create-ixfr: yes
