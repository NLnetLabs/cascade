# Making reusable composite actions documented at
# https://docs.github.com/en/actions/tutorials/create-actions/create-a-composite-action#creating-a-composite-action-within-the-same-repository
name: 'Sign using a HSM'
description: 'Sign using a HSM'
defaults:
  # see: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#defaultsrunshell
  run:
    shell: bash --noprofile --norc -eo pipefail -x {0}
inputs:
  log-level:
    description: The level of logging that Cascade should output.
    required: false
    default: debug
    type: choice
    options:
      - error
      - warning
      - info
      - debug
      - trace
  algorithm:
    description: The DNSSEC algorithm to sign the zone with.
    required: false
    default: ECDSAP256SHA256
    type: string
runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/prepare-systest-env
    - uses: ./.github/actions/setup-and-start-cascade
      with:
        log-level: ${{ inputs.log-level }}

    - name: Start Cascade-HSM-Bridge
      run: |
        INTEGRATION_TEST_DIR="${PWD}/integration-tests/sign-using-a-hsm"

        # Tell the OpenSC project PKCS11-Spy module to passthrough to the
        # SoftHSMv2 PKCS#11 module.
        export PKCS11SPY="/lib/x86_64-linux-gnu/softhsm/libsofthsm2.so"
        export PKCS11SPY_OUTPUT="${PWD}/pkcs11-spy.log"

        # Start Cascade-HSM-Bridge with our configuration file that directs it
        # to load the PKCS11-Spy PKCS#11 module which in turn will load and
        # passthrough to the NitroKey NetHSM PKCS#11 module.
        cascade-hsm-bridge --config "${INTEGRATION_TEST_DIR}/cascade-hsm-bridge.toml"

    - name: Configure Cascade to use SoftHSM
      run: |
        cascade hsm add --insecure --username Cascade --password 1234 cascade-hsm-bridge 127.0.0.1

    - name: Add a policy that uses the HSM with algorithm ${{ inputs.algorithm }}
      run: |
        POLICY_DIR=$(integration-tests/scripts/get-default-path.sh policy-dir)
        cascade template policy > "${POLICY_DIR}/with-hsm.toml"
        sed -i -e 's/^#hsm-server-id.\+/hsm-server-id = "cascade-hsm-bridge"/' "${POLICY_DIR}/with-hsm.toml"
        sed -i -e 's/^algorithm =.\+/algorithm = "${{ inputs.algorithm }}"/' "${POLICY_DIR}/with-hsm.toml"
        cascade policy reload

    - name: Add a zone served by the NSD primary
      run: |
        cascade zone add --policy with-hsm --source 127.0.0.1:1055 example.test

    - name: Query zone
      run: |
        dig @127.0.0.1 -p 4542 example.test AXFR >dig-axfr.log
        grep -q SOA dig-axfr.log

    - name: Query the detailed key output of Cascade for KMIP IDs
      run: |
        cascade zone status --detailed example.test | grep -Fq 'kmip://'

    - name: Record KMIP keys, remove zone, and add the zone with imported KMIP keys
      run: |
        split_kmip_url() {
            server=$(echo "$1" | sed 's,kmip://\([^/]*\).*,\1,')
            id=$(echo "$1" | sed 's,.*keys/\([^/]*\)_pub.*,\1,')
            algorithm=$(echo "$1" | sed 's,.*algorithm=\([^&]*\).*,\1,')
            flags=$(echo "$1" | sed 's,.*flags=\(.*\)$,\1,')
            echo "$server" "$id" "$algorithm" "$flags"
        }
        cascade zone status --detailed example.test | grep 'Reference:' |
            sed 's/.*kmip/kmip/' > /tmp/keys
            while read url
            do
                set -- $(split_kmip_url "$url")
                if [ "$4" = 257 ]
                then
                    ksk_server="$1"
                    ksk_id="$2"
                    ksk_algorithm="$3"
                    ksk_flags="$4"
                else
                    zsk_server="$1"
                    zsk_id="$2"
                    zsk_algorithm="$3"
                    zsk_flags="$4"
                fi
            done < /tmp/keys
        echo "ksk: $ksk_server $ksk_id $ksk_algorithm $ksk_flags"
        echo "zsk: $zsk_server $zsk_id $zsk_algorithm $zsk_flags"
        # Remove the existing zone
        cascade zone maintenance enable example.test
        cascade zone remove example.test
        # Add the new zone with imported keys
        # Should use the algorithm for this test instead of what we found
        # in the URL. Currently Cascade sends the string unchecked to
        # keyset which only accepts a number.
        cascade zone add \
            --import-ksk-kmip "$ksk_server" "$ksk_id"_pub "$ksk_id"_priv "$ksk_algorithm" "$ksk_flags" \
            --import-zsk-kmip "$zsk_server" "$zsk_id"_pub "$zsk_id"_priv "$zsk_algorithm" "$zsk_flags" \
            --policy with-hsm --source 127.0.0.1:1055 example.test
        # Check that the keys are imported.
        cascade zone status --detailed example.test | grep 'Reference:' |
            grep -Fq "$ksk_id"
        cascade zone status --detailed example.test | grep 'Reference:' |
            grep -Fq "$zsk_id"
        # Start a ZSK roll
        cascade keyset example.test zsk start-roll
        # Check that we got a new KMIP key
        cascade zone status --detailed example.test | grep 'Reference:' |
            grep -v "$ksk_id" |
            grep -v "$zsk_id" |
            grep -Fq 'kmip://'
        # Remove the zone again and now try with a policy that keeps keys in
        # files.
        cascade zone maintenance enable example.test
        cascade zone remove example.test
        # Add the new zone with imported keys
        # Should use the algorithm for this test instead of what we found
        # in the URL.
        cascade zone add \
            --import-ksk-kmip "$ksk_server" "$ksk_id"_pub "$ksk_id"_priv "$ksk_algorithm" "$ksk_flags" \
            --import-zsk-kmip "$zsk_server" "$zsk_id"_pub "$zsk_id"_priv "$zsk_algorithm" "$zsk_flags" \
            --policy default --source 127.0.0.1:1055 example.test
        # Check that the keys are imported.
        cascade zone status --detailed example.test | grep 'Reference:' |
            grep -Fq "$ksk_id"
        cascade zone status --detailed example.test | grep 'Reference:' |
            grep -Fq "$zsk_id"
        # Start a ZSK roll
        cascade keyset example.test algorithm start-roll
        # Check that we got a new KMIP key
        cascade zone status --detailed example.test | grep 'Reference:' |
            grep -v "$ksk_id" |
            grep -v "$zsk_id" |
            grep -Fq 'file://'

    - name: Print log files on any failure in this job
      uses: ./.github/actions/print-logfiles
      if: failure()
